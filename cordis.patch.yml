# kilo-zen2dsh DSH plugin — bundle patch: insert the plugin row (deployment-global).
#
# The plugin itself is distributed as the npm package @huanx/kilo-zen2dsh
# (declared in dependencies); this patch only inserts its loader row.
# Defaults need no edits: native adapters register Kilo (keyless) and OpenCode
# Zen (public compatibility lane) with no extra process. Override any option via
# the config object (src/config.ts); set zenEnabled: false for Kilo only.
- insert:
    - id: kilo2dsh
      name: '@huanx/kilo-zen2dsh'
      config: {}
